<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disco Ball</title><link rel="stylesheet" href="style.css"><script src="/apps/sdk/apps-v1.js"></script><script defer src="app.js"></script></head>
<body><main>
<header><div class="brand"><strong>Disco Ball</strong><span>Mirror Groove</span></div><span id="status" role="status">Loading…</span></header>
<div id="stage"><canvas id="ball"></canvas>
<div class="hud">
<button id="chipScale" class="chip"><span>Scale <small>E2 press</small></span><strong>Major</strong></button>
<button id="chipVoice" class="chip"><span>Voice <small>E4 press</small></span><strong>Bell</strong></button>
<button id="chipBeat" class="chip"><span>Beat <small>K4</small></span><strong>On</strong></button>
<button id="chipPlay" class="chip primary"><span>K2</span><strong>Start</strong></button>
</div></div>
</main></body></html>
