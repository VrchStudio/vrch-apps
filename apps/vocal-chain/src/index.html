<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Vocal Chain</title>
<link rel="stylesheet" href="style.css">
<script src="/apps/sdk/apps-v1.js"></script>
</head>
<body>
<div id="app">
  <header>
    <div id="gainblock">
      <b id="gain">36</b><span>dB</span>
      <small id="keyshow">A minor</small>
    </div>
    <div id="side">
      <div id="tuner">
        <b id="note">—</b>
        <span id="hz"></span>
        <span id="to"></span>
      </div>
      <div id="lvl" title="Input level"><i id="lvl-in"></i></div>
    </div>
    <div id="flags">
      <span id="flag-tune" class="flag on">Tune</span>
      <span id="flag-dn" class="flag on">Denoise</span>
      <span id="flag-ott" class="flag on">OTT</span>
      <span id="flag-dist" class="flag off">Distortion</span>
    </div>
  </header>

  <nav id="tabs"></nav>

  <section id="rows"></section>

  <section id="chain">
    <div class="cnode on" id="n-pre">Preamp</div>
    <i>›</i>
    <div class="cnode" id="n-dn">Denoise</div>
    <i>›</i>
    <div class="cnode" id="n-tune">Tune</div>
    <i>›</i>
    <div class="cnode" id="n-dist">Distortion</div>
    <i>›</i>
    <div class="cnode" id="n-ott">OTT</div>
    <i>›</i>
    <div class="cnode on" id="n-lim">Limiter</div>
  </section>

  <section id="presets"></section>

  <footer id="status"></footer>

  <div id="gate" hidden><div><p id="gate-msg"></p><button id="gate-btn">Start</button></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
