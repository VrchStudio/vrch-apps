<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metronome</title><link rel="stylesheet" href="style.css"><script src="/apps/sdk/apps-v1.js"></script><script defer src="app.js"></script></head>
<body><main>
<header><h1>Metronome</h1><span id="status" role="status">Loading…</span></header>
<section class="tempo" aria-label="Tempo">
<div class="tempo-value"><button id="slower" class="button step" aria-label="Slower">−</button><div><output id="bpm">120</output><span class="unit">BPM <small>E1</small></span></div><button id="faster" class="button step" aria-label="Faster">+</button></div>
<input id="tempo" aria-label="Tempo in beats per minute" type="range" min="40" max="240" value="120">
</section>
<div id="beats" class="beats" aria-label="Beat position"></div>
<section class="settings" aria-label="Rhythm settings">
<button id="meter" class="button setting"><span>Beats <small>E2</small></span><strong>4</strong></button>
<button id="division" class="button setting"><span>Split <small>E3</small></span><strong>1×</strong></button>
<button id="sound" class="button setting"><span>Sound <small>E4</small></span><strong>Click</strong></button>
</section>
<footer><button id="toggle" class="button primary" disabled>Start <small>K2</small></button><button id="tap" class="button" disabled>Tap <small>K3</small></button><button id="reset" class="button" disabled>Reset <small>K4</small></button></footer>
</main></body></html>
