<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Wavescape</title>
<link rel="stylesheet" href="style.css">
<script src="/apps/sdk/apps-v1.js"></script>
<script src="dsp.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<main class="app">
  <header class="top">
    <span class="brand">Wavetable Synthesizer <b>wavescape</b></span>
    <span class="patch" id="patchName">01 GLASS PAD</span>
  </header>

  <nav class="sections" id="sections" aria-label="Sections"></nav>

  <section class="panel">
    <div class="view">
      <canvas id="wt" aria-label="Wavetable"></canvas>
      <span class="audio" id="audioState"></span>
    </div>
    <div class="side">
      <div class="pagetitle" id="pageTitle">OSC 1</div>
      <div class="controls" id="controls"></div>
    </div>
  </section>

  <section class="deck">
    <div class="row">
      <div class="grp">
        <button class="btn lblue" id="mNOTE" type="button"><i class="lamp"></i><span>NOTE</span></button>
        <button class="btn lblue" id="mARP" type="button"><i class="lamp"></i><span>ARPEGGIO</span></button>
        <button class="btn lblue" id="mSEQ" type="button"><i class="lamp"></i><span>SEQ</span></button>
      </div>
      <button class="btn white" id="start" type="button"><i class="lamp"></i><span>START</span></button>
      <canvas class="led" id="led" width="168" height="56" aria-label="Display"></canvas>
      <button class="btn white" id="hold" type="button"><i class="lamp"></i><span>HOLD</span></button>
      <button class="btn orange" id="patch" type="button"><i class="lamp"></i><span>PATCH</span></button>
      <button class="chip" id="seqPage" type="button" hidden>PAGE 1/1</button>
      <button class="chip" id="rnd" type="button" hidden>RND</button>
    </div>
    <div class="steps" id="steps"></div>
    <div class="labels" id="stepLabels"></div>
  </section>

  <div class="editor" id="stepEditor" hidden>
    <div class="edhead">
      <b id="edTitle">STEP 1</b>
      <span id="edNotes">REST</span>
      <button type="button" id="edClose">DONE</button>
    </div>
    <div class="edkeys">
      <button type="button" id="edDown">−</button>
      <div class="keys" id="edKeys"></div>
      <button type="button" id="edUp">+</button>
      <span class="edoct" id="edOct">C3</span>
    </div>
    <div class="edrow">
      <label>GATE <input type="range" id="edGate" min="5" max="100"></label>
      <label>VEL <input type="range" id="edVel" min="1" max="127"></label>
      <button type="button" id="edTie">TIE</button>
      <button type="button" id="edClear">CLEAR</button>
    </div>
  </div>

  <p class="notice" id="notice" role="status" hidden></p>
</main>
</body>
</html>
