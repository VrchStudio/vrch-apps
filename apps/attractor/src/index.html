<!doctype html>
<html lang="en" class="vrch-foundation">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>App</title>
<link rel="stylesheet" href="css/fontawesome-local.css">
<link rel="stylesheet" href="css/vrch_colors_and_styles.css">
<link rel="stylesheet" href="css/vrch_pages_v2.css">
<link rel="stylesheet" href="css/vrch_pages_scene_v2.css">
<link rel="stylesheet" href="style.css">
<script src="/apps/sdk/apps-v1.js"></script>
<script src="scripts/vrch_pages_dialogs.js"></script>
<script src="formulas.js"></script>
<script src="thread.js"></script>
<script src="picture.js"></script>
<script src="tracks.js"></script>
<script src="music.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<main id="stage">
  <canvas id="picture"></canvas>
  <div id="corner">
    <div id="text"><pre id="lines"></pre><pre id="letters"></pre><pre id="count"></pre></div>
    <p id="status" hidden></p>
    <p id="flag" hidden>Collapsed to a few points · K2 next preset</p>
  </div>
  <p id="notice" hidden>This browser cannot draw this picture.</p>
</main>
<div id="quick" class="player__quick ui-control-context"><button id="speaker" class="player__quick-btn" type="button" aria-label="Mute" aria-pressed="false" hidden><i class="fas fa-volume-high" aria-hidden="true"></i></button></div>
<div id="figures" class="ui-modal player-panel ui-control-context" role="dialog" aria-modal="true" aria-label="Figures" hidden>
  <section class="ui-modal__dialog scene-picker-dialog player-panel__dialog">
    <vrch-dialog-header icon="fa-shapes" label="Figures"><button slot="close" id="figuresClose" type="button" class="ui-icon-action ui-dialog__close" aria-label="Close Figures"><i class="fas fa-xmark" aria-hidden="true"></i></button></vrch-dialog-header>
    <div id="figuresBody" class="ui-dialog__body player-panel__body"></div>
  </section>
</div>
<div id="player" class="ui-modal player-panel ui-control-context" role="dialog" aria-modal="true" aria-label="Player" hidden>
  <section class="ui-modal__dialog scene-picker-dialog player-panel__dialog">
    <vrch-dialog-header icon="fa-music" label="Player"><button slot="close" id="playerClose" type="button" class="ui-icon-action ui-dialog__close" aria-label="Close Player"><i class="fas fa-xmark" aria-hidden="true"></i></button></vrch-dialog-header>
    <div id="playerBody" class="ui-dialog__body player-panel__body"></div>
  </section>
</div>
</body>
</html>
