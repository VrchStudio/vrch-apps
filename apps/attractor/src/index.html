<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>App</title>
<link rel="stylesheet" href="style.css">
<script src="/apps/sdk/apps-v1.js"></script>
<script src="formulas.js"></script>
<script src="thread.js"></script>
<script src="picture.js"></script>
<script src="tracks.js"></script>
<script src="music.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<main id="stage">
  <canvas id="picture"></canvas>
  <div id="corner">
    <div id="text"><pre id="lines"></pre><pre id="letters"></pre><pre id="count"></pre></div>
    <p id="status" hidden></p>
    <p id="flag" hidden>Collapsed to a few points · K2 next preset</p>
  </div>
  <p id="notice" hidden>This browser cannot draw this picture.</p>
</main>
<button id="speaker" type="button" aria-label="Mute" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path class="on" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
<aside id="player" aria-label="Player" hidden>
  <header><span>Player</span><button id="playerClose" type="button" aria-label="Close Player">×</button></header>
  <div id="playerBody"></div>
</aside>
</body>
</html>
