name: Check Apps
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for app in apps/*; do
            python3 tools/apps.py check "${app##*/}"
            python3 tools/apps.py build "${app##*/}"
          done
